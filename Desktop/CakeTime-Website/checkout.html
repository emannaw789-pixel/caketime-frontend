<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CakeTime Checkout 🍰</title>
</head>

<body>

<h2>Checkout Page</h2>

<input id="name" placeholder="Your Name"><br><br>
<input id="phone" placeholder="Phone Number"><br><br>
<input id="address" placeholder="Address"><br><br>

<select id="cake">
  <option value="Chocolate Cake">Chocolate Cake</option>
  <option value="Vanilla Cake">Vanilla Cake</option>
  <option value="Red Velvet Cake">Red Velvet Cake</option>
</select><br><br>

<input id="qty" type="number" value="1"><br><br>

<p>Total: <span id="total">1200</span></p>

<button onclick="confirmOrder()">Confirm Order</button>

<script src="checkout.js"></script>

</body>
</html>
