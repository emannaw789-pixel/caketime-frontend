<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - CakeTime PRO</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f5f5f5;
}

header{
  background:#99244F;
  color:white;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.order{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.order h3{
  margin:0 0 10px 0;
  color:#99244F;
}

.item{
  padding:5px 0;
  border-bottom:1px solid #eee;
}

.total{
  font-weight:bold;
  margin-top:10px;
  color:green;
}

button{
  background:#99244F;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  🍰 CakeTime Admin Panel
</header>

<div class="container">

  <button onclick="loadOrders()">🔄 Refresh Orders</button>

  <div id="orders"></div>

</div>

<script>

async function loadOrders() {

  const res = await fetch("http://localhost:5000/orders");
  const data = await res.json();

  const container = document.getElementById("orders");

  if (data.length === 0) {
    container.innerHTML = "<p>No orders found</p>";
    return;
  }

  container.innerHTML = data.reverse().map(order => {

    return `
      <div class="order">
        <h3>Order ID: ${order.id}</h3>

        ${order.items.map(item => `
          <div class="item">
            ${item.name} - Rs ${item.price} × ${item.qty}
          </div>
        `).join('')}

        <div class="total">
          Total: Rs ${order.total}
        </div>
      </div>
    `;
  }).join('');
}

loadOrders();

</script>

</body>
</html>
